<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>محاكي انتقال الصوت في مواد مختلفة</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        canvas {
            border: 1px solid #333;
            margin-top: 20px;
            background-color: #f0f0f0;
        }
        .controls {
            margin: 20px 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .material-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-size: 16px;
        }
        .material-btn:hover {
            opacity: 0.9;
        }
        .vacuum { background-color: #000000; color: white; }
        .air { background-color: #A0D2F0; }
        .water { background-color: #4A90E2; color: white; }
        .wood { background-color: #A77B45; color: white; }
        .steel { background-color: #8E9193; color: white; }
        .concrete { background-color: #919191; color: white; }
        .info-panel {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            text-align: right;
        }
        .play-btn {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
        }
        .play-btn:hover {
            background-color: #45a049;
        }
        .frequency-control, .sound-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .sound-controls {
            background-color: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
            border: 1px dashed #999;
            margin-bottom: 15px;
        }
        label {
            font-weight: bold;
        }
        input[type="range"] {
            width: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>محاكي انتقال الصوت في مواد مختلفة</h1>
        
        <div class="controls">
            <button id="playBtn" class="play-btn">بدء المحاكاة</button>
            <button id="pauseBtn" class="play-btn" style="background-color: #f44336;">إيقاف</button>
        </div>
        
        <div class="frequency-control">
            <label for="frequencySlider">تردد الموجة الصوتية (هرتز):</label>
            <input type="range" id="frequencySlider" min="1" max="10" value="2" step="0.1">
            <span id="frequencyValue">2.0</span>
        </div>
        
        <div class="sound-controls">
            <label for="audioFreqSlider">تردد الصوت (هرتز):</label>
            <input type="range" id="audioFreqSlider" min="200" max="2000" value="440" step="10">
            <span id="audioFreqValue">440</span>
            <button id="playSound" class="play-btn" style="background-color: #9c27b0; margin-right: 10px;">تشغيل النغمة</button>
            <button id="stopSound" class="play-btn" style="background-color: #f44336;">إيقاف النغمة</button>
        </div>
        
        <h3>اضغط على المادة لرؤية سلوك الصوت فيها:</h3>
        <div class="controls">
            <button class="material-btn vacuum" data-material="vacuum">فراغ (0 م/ثانية)</button>
            <button class="material-btn air" data-material="air">هواء (343 م/ثانية)</button>
            <button class="material-btn water" data-material="water">ماء (1481 م/ثانية)</button>
            <button class="material-btn wood" data-material="wood">خشب (3300 م/ثانية)</button>
            <button class="material-btn steel" data-material="steel">فولاذ (5100 م/ثانية)</button>
            <button class="material-btn concrete" data-material="concrete">خرسانة (3600 م/ثانية)</button>
        </div>
        
        <canvas id="waveCanvas" width="700" height="300"></canvas>
        
        <div class="info-panel">
            <h3 id="materialTitle">هواء - سرعة الصوت: 343 م/ثانية</h3>
            <p id="materialDescription">
                ينتقل الصوت في الهواء عبر موجات الضغط. الهواء وسط ذو كثافة منخفضة ولذلك سرعة الصوت فيه منخفضة نسبياً.
            </p>
        </div>
    </div>

    <script>
        // Audio context for sound generation
        let audioContext;
        let oscillator;
        let gainNode;
        let isAudioPlaying = false;

        // Check if Web Audio API is supported
        function initAudio() {
            try {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioContext();
                
                // Create gain node to control volume
                gainNode = audioContext.createGain();
                gainNode.gain.value = 0.3; // Set volume to 30%
                gainNode.connect(audioContext.destination);
                
                return true;
            } catch(e) {
                console.warn('Web Audio API is not supported in this browser');
                return false;
            }
        }

        function playTone(frequency, materialType) {
            if (!audioContext) {
                if (!initAudio()) return;
            }
            
            if (isAudioPlaying) {
                stopTone();
            }
            
            // Resume audio context if it's suspended (needed for Chrome)
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            // Create oscillator
            oscillator = audioContext.createOscillator();
            oscillator.type = 'sine'; // Sine wave
            oscillator.frequency.value = frequency; // Set frequency
            
            // Apply material effects
            const materialEffects = {
                vacuum: { detune: 0, q: 0, volume: 0 }, // No sound in vacuum
                air: { detune: 0, q: 1, volume: 0.3 }, // No change - reference
                water: { detune: -50, q: 5, volume: 0.3 }, // Lower pitch, more resonance
                wood: { detune: 100, q: 10, volume: 0.3 }, // Higher pitch, more resonance
                steel: { detune: 200, q: 15, volume: 0.3 }, // Even higher pitch, much more resonance
                concrete: { detune: 50, q: 8, volume: 0.3 } // Slightly higher pitch, medium resonance
            };
            
            const effect = materialEffects[materialType] || materialEffects.air;
            
            // Apply detune (slight frequency change)
            oscillator.detune.value = effect.detune;
            
            // Create filter for resonance simulation
            const filter = audioContext.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = frequency;
            filter.Q.value = effect.q;
            
            // Set volume
            gainNode.gain.value = effect.volume;
            
            // Connect oscillator to filter to gain node
            oscillator.connect(filter);
            filter.connect(gainNode);
            
            // Start the oscillator
            oscillator.start();
            isAudioPlaying = true;
        }

        function stopTone() {
            if (oscillator) {
                oscillator.stop();
                oscillator.disconnect();
                isAudioPlaying = false;
            }
        }

        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const frequencySlider = document.getElementById('frequencySlider');
        const frequencyValueSpan = document.getElementById('frequencyValue');
        const materialTitle = document.getElementById('materialTitle');
        const materialDescription = document.getElementById('materialDescription');
        
        let isPlaying = false;
        let animationId = null;
        
        // Physical properties of different materials (speed of sound in m/s)
        const materials = {
            vacuum: { 
                speed: 0, 
                name: "فراغ", 
                description: "في الفراغ لا توجد مادة يمكن أن تنقل موجات الصوت. لا يوجد وسط مادي يمكن أن تحدث فيه الانضغاطات والتمددات التي تشكل موجات الضغط. لذلك، لا يمكن للصوت أن ينتقل في الفراغ.",
                color: "#000000"
            },
            air: { 
                speed: 343, 
                name: "هواء", 
                description: "ينتقل الصوت في الهواء عبر موجات الضغط. الهواء وسط ذو كثافة منخفضة ولذلك سرعة الصوت فيه منخفضة نسبياً.",
                color: "#A0D2F0"
            },
            water: { 
                speed: 1481, 
                name: "ماء", 
                description: "في الماء، ينتقل الصوت بسرعة أكبر من الهواء بسبب الكثافة والصلابة العالية للوسط. تنتقل الطاقة الصوتية بكفاءة أكبر.",
                color: "#4A90E2"
            },
            wood: { 
                speed: 3300, 
                name: "خشب", 
                description: "في الخشب، ينتقل الصوت عبر تمدد وانكماش البنية الجزيئية. التركيب الليفي للخشب يسمح بانتقال الصوت بكفاءة على طول اتجاه الألياف.",
                color: "#A77B45"
            },
            steel: { 
                speed: 5100, 
                name: "فولاذ", 
                description: "الفولاذ مادة صلبة جداً ذات روابط جزيئية قوية، مما يسمح لموجات الصوت بالتحرك بسرعة عالية جداً. الفولاذ موصل ممتاز للصوت.",
                color: "#8E9193"
            },
            concrete: { 
                speed: 3600, 
                name: "خرسانة", 
                description: "الخرسانة مادة كثيفة وصلبة تسمح لموجات الصوت بالمرور بسرعة عالية. ومع ذلك، فإن بنيتها المسامية يمكن أن تسبب امتصاص وتشتت الصوت.",
                color: "#919191"
            }
        };
        
        let currentMaterial = materials.air;
        let phase = 0;
        let frequency = 2;
        
        // Initialize the wave display
        function init() {
            const audioFreqSlider = document.getElementById('audioFreqSlider');
            const audioFreqValue = document.getElementById('audioFreqValue');
            const playSound = document.getElementById('playSound');
            const stopSound = document.getElementById('stopSound');
            
            frequencySlider.addEventListener('input', function() {
                frequency = parseFloat(this.value);
                frequencyValueSpan.textContent = frequency.toFixed(1);
                if (!isPlaying) {
                    drawWave();
                }
            });
            
            // Initialize audio controls
            if (audioFreqSlider && audioFreqValue) {
                audioFreqSlider.addEventListener('input', function() {
                    const freq = parseFloat(this.value);
                    audioFreqValue.textContent = freq;
                    
                    // Update oscillator frequency if sound is playing
                    if (isAudioPlaying && oscillator) {
                        oscillator.frequency.value = freq;
                    }
                });
            }
            
            // Play sound button
            if (playSound) {
                playSound.addEventListener('click', function() {
                    const freq = parseFloat(audioFreqSlider.value);
                    playTone(freq, Object.keys(materials).find(key => materials[key] === currentMaterial));
                });
            }
            
            // Stop sound button
            if (stopSound) {
                stopSound.addEventListener('click', stopTone);
            }
            
            document.querySelectorAll('.material-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const material = this.getAttribute('data-material');
                    currentMaterial = materials[material];
                    updateInfoPanel();
                    
                    // Update sound if playing
                    if (isAudioPlaying) {
                        const freq = parseFloat(audioFreqSlider.value);
                        playTone(freq, material);
                    }
                    
                    if (!isPlaying) {
                        drawWave();
                    }
                });
            });
            
            playBtn.addEventListener('click', startAnimation);
            pauseBtn.addEventListener('click', stopAnimation);
            
            drawWave();
            updateInfoPanel();
            
            // Initialize audio system
            initAudio();
        }
        
        function updateInfoPanel() {
            materialTitle.textContent = `${currentMaterial.name} - سرعة الصوت: ${currentMaterial.speed} م/ثانية`;
            materialDescription.textContent = currentMaterial.description;
        }
        
        function drawWave() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Scale factor to visualize different speeds
            const baseSpeedFactor = 343; // Speed of sound in air (reference)
            const speedFactor = currentMaterial.speed / baseSpeedFactor;
            
            // Draw material representation
            ctx.fillStyle = currentMaterial.color;
            ctx.globalAlpha = 0.2;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = 1.0;
            
            // Special case for vacuum - no wave propagation
            if (currentMaterial.speed === 0) {
                // Draw source
                ctx.beginPath();
                ctx.arc(30, canvas.height / 2, 15, 0, 2 * Math.PI);
                ctx.fillStyle = isPlaying ? 'red' : '#333';
                ctx.fill();
                
                // Draw static particles
                const particleCount = 20;
                const particleSpacing = canvas.width / particleCount;
                
                for (let i = 0; i < particleCount; i++) {
                    const x = i * particleSpacing + particleSpacing / 2;
                    const y = canvas.height / 2; // No displacement in vacuum
                    
                    ctx.beginPath();
                    ctx.arc(x, y, 5, 0, 2 * Math.PI);
                    ctx.fillStyle = '#333';
                    ctx.fill();
                }
                
                // Draw "no propagation" message
                ctx.font = "18px Arial";
                ctx.fillStyle = "red";
                ctx.textAlign = "center";
                ctx.fillText("الصوت لا يمكن أن ينتقل في الفراغ - لا يوجد وسط لنقل موجات الضغط", canvas.width / 2, canvas.height / 4);
                
                return; // Exit the function early
            }
            
            // Draw wave
            ctx.beginPath();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            
            const amplitude = 50;
            const wavelength = (canvas.width / 5) * speedFactor; // Adjust wavelength based on material speed
            
            for (let x = 0; x < canvas.width; x++) {
                const y = canvas.height / 2 + amplitude * Math.sin((x / wavelength * 2 * Math.PI * frequency) + phase);
                
                if (x === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            
            ctx.stroke();
            
            // Draw source
            ctx.beginPath();
            ctx.arc(30, canvas.height / 2, 15, 0, 2 * Math.PI);
            ctx.fillStyle = isPlaying ? 'red' : '#333';
            ctx.fill();
            
            // Draw particles
            const particleCount = 20;
            const particleSpacing = canvas.width / particleCount;
            
            for (let i = 0; i < particleCount; i++) {
                const x = i * particleSpacing + particleSpacing / 2;
                const baseY = canvas.height / 2;
                const displacement = amplitude * Math.sin((x / wavelength * 2 * Math.PI * frequency) + phase);
                const y = baseY + displacement;
                
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, 2 * Math.PI);
                ctx.fillStyle = '#333';
                ctx.fill();
                
                // Draw vertical line to show displacement
                ctx.beginPath();
                ctx.moveTo(x, baseY);
                ctx.lineTo(x, y);
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }
        
        function animate() {
            phase += 0.05 * (currentMaterial.speed / 343); // Adjust phase change by material speed
            drawWave();
            
            if (isPlaying) {
                animationId = requestAnimationFrame(animate);
            }
        }
        
        function startAnimation() {
            if (!isPlaying) {
                isPlaying = true;
                animate();
            }
        }
        
        function stopAnimation() {
            isPlaying = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
        }
        
        // Start the simulator
        init();
    </script>
</body>
</html>
